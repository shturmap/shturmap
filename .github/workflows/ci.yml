# Build and test every push (owner, 2026-10-05; docs/DESIGN.md §8, "Continuous integration"). Windows, since the app,
# the game reader, the session and the CLI build for Windows only. Tests that need what only the owner's PC has (the
# tarkov.dev cache, the game's logs, real screenshots, a Release build, the website beside the repository) skip here.
# The repository is public, and so are this workflow's logs: nothing here prints quest texts, logs or secrets.
# Every action is pinned to a full commit, with its version beside it: a tag can be moved, a commit can't.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The same wrapper as on the developer's PC (CLAUDE.md); it takes the SDK setup-dotnet put in DOTNET_ROOT.
      - name: Build
        shell: pwsh
        run: .\eng\dotnet.ps1 build Shturmap.slnx

      - name: Test
        shell: pwsh
        run: .\eng\dotnet.ps1 test --solution Shturmap.slnx --no-build

      # Known vulnerabilities in the NuGet packages, direct or transitive (in place of Dependabot: CLAUDE.md allows no
      # other identity in the commits). Also when a test failed, so neither hides the other.
      - name: Vulnerable packages
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .\eng\audit-packages.ps1
